[project]
name = "fidelis"
version = "0.3.0a0"
description = "Fidelis backend-authoritative musical reconstruction deck"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128",
  "uvicorn>=0.48",
  "python-multipart>=0.0.20",
  "numpy>=2.0",
  "scipy>=1.14",
  "librosa>=0.11",
  "soundfile>=0.13",
  "httpx>=0.28",
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "python scripts/build_frontend.py"
